[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "flask",
    "flask-sock",
    "httpx",
    "playwright",
    "pydantic",
    "PyPDF2",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", ".venv*", "*.egg-info"]
