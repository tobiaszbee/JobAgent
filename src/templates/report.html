<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Search Report — {{ timestamp }}</title>
  <style>
    {% include 'report.css' %}
  </style>
</head>
<body>

<header>
  <h1>Job Search Report</h1>
  <p>Generated: {{ timestamp }}</p>
</header>

<div class="stats">
  <div class="stat"><div class="val">{{ stats.total }}</div><div class="lbl">Total</div></div>
  <div class="stat"><div class="val">{{ stats.reviewed }}</div><div class="lbl">Reviewed</div></div>
  <div class="stat"><div class="val">{{ stats.rejected }}</div><div class="lbl">Rejected</div></div>
  <div class="stat"><div class="val">{{ stats.applied }}</div><div class="lbl">Applied</div></div>
  <div class="stat"><div class="val">{{ stats.avg_score or '—' }}</div><div class="lbl">Avg Score</div></div>
</div>

<div class="controls">
  <input type="text" id="search" placeholder="Search title, company, location...">
  <select id="sort">
    <option value="score">Sort by score</option>
    <option value="date">Sort by date</option>
    <option value="company">Sort by company</option>
  </select>
  <select id="min-score">
    <option value="0">All scores</option>
    <option value="5">Score ≥ 5</option>
    <option value="6" selected>Score ≥ 6</option>
    <option value="7">Score ≥ 7</option>
    <option value="8">Score ≥ 8</option>
  </select>
  <span class="count" id="count"></span>
</div>

<div class="jobs" id="jobs-container"></div>

<script>
  const ALL_JOBS = {{ jobs_json | safe }};

  function scoreClass(s) {
    if (!s && s !== 0) return 'score-none';
    if (s >= 7) return 'score-high';
    if (s >= 5) return 'score-mid';
    return 'score-low';
  }

  function formatDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const sort = document.getElementById('sort').value;
    const minScore = parseFloat(document.getElementById('min-score').value);

    let jobs = ALL_JOBS.filter(j => {
      if ((j.score || 0) < minScore) return false;
      if (!q) return true;
      return (j.title + j.company + j.location).toLowerCase().includes(q);
    });

    if (sort === 'score') jobs.sort((a, b) => (b.score || 0) - (a.score || 0));
    if (sort === 'date') jobs.sort((a, b) => new Date(b.found_at) - new Date(a.found_at));
    if (sort === 'company') jobs.sort((a, b) => a.company.localeCompare(b.company));

    document.getElementById('count').textContent = `${jobs.length} job${jobs.length !== 1 ? 's' : ''}`;

    const container = document.getElementById('jobs-container');
    if (!jobs.length) {
      container.innerHTML = '<div class="no-results">No jobs match your filters.</div>';
      return;
    }

    container.innerHTML = jobs.map(j => {
      const score = j.score != null ? j.score.toFixed(1) : '—';
      const sc = scoreClass(j.score);
      const statusTag = j.status === 'applied'
        ? `<span class="tag tag-applied">Applied</span>`
        : `<span class="tag tag-status">${j.status}</span>`;

      return `
        <div class="job-card">
          <div class="job-header">
            <div>
              <a class="job-title" href="${j.url}" target="_blank">${j.title}</a>
              <div class="job-company">${j.company}</div>
              <div class="job-location">📍 ${j.location}</div>
            </div>
            <div class="score-badge ${sc}">${score}</div>
          </div>
          ${j.reasoning ? `<div class="job-reasoning">${j.reasoning}</div>` : ''}
          <div class="job-meta">
            ${statusTag}
            <span class="job-date">Found: ${formatDate(j.found_at)}</span>
          </div>
        </div>`;
    }).join('');
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('sort').addEventListener('change', render);
  document.getElementById('min-score').addEventListener('change', render);

  render();
</script>

</body>
</html>
