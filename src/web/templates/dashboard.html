<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Agent Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>

<header>
  <h1>Job Agent Dashboard</h1>
  <div class="header-right">
    <span id="last-updated"></span>
    <button class="btn-run" id="btn-run" onclick="openRunModal()">▶ Run Agent</button>
  </div>
</header>

<div class="stats">
  <div class="stat"><div class="val" id="s-total">—</div><div class="lbl">Total</div></div>
  <div class="stat"><div class="val" id="s-new">—</div><div class="lbl">New</div></div>
  <div class="stat"><div class="val" id="s-reviewed">—</div><div class="lbl">Reviewed</div></div>
  <div class="stat"><div class="val" id="s-applied">—</div><div class="lbl">Applied</div></div>
  <div class="stat"><div class="val" id="s-rejected">—</div><div class="lbl">Rejected</div></div>
  <div class="stat"><div class="val" id="s-auto-rejected">—</div><div class="lbl">Auto-rejected</div></div>
  <div class="stat"><div class="val" id="s-avg">—</div><div class="lbl">Avg Score</div></div>
</div>

<div class="status-tabs">
  <div class="tab active" data-status="all">All</div>
  <div class="tab" data-status="new">New</div>
  <div class="tab" data-status="reviewed">Reviewed</div>
  <div class="tab" data-status="applied">Applied</div>
  <div class="tab" data-status="rejected">Rejected</div>
  <div class="tab" data-status="auto_rejected">Auto-rejected</div>
  <div class="tab tab-criteria" data-status="criteria">⚙ Criteria</div>
</div>

<div class="toolbar" id="jobs-toolbar">
  <input type="text" id="search" placeholder="Search title, company, location...">
  <select id="min-score">
    <option value="">All scores</option>
    <option value="5">Score ≥ 5</option>
    <option value="6">Score ≥ 6</option>
    <option value="7">Score ≥ 7</option>
    <option value="8">Score ≥ 8</option>
  </select>
  <select id="sort">
    <option value="score">Sort by score</option>
    <option value="date">Sort by date</option>
    <option value="company">Sort by company</option>
  </select>
  <span class="count" id="count"></span>
</div>

<div class="jobs" id="jobs-container"></div>

<div class="criteria-panel" id="criteria-panel" style="display:none">
  <div class="criteria-grid" id="criteria-grid"></div>
</div>

<!-- Run Modal -->
<div class="modal-overlay" id="run-modal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h2>Run Agent</h2>
      <button class="modal-close" onclick="closeRunModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="run-params">
        <label>
          Search last
          <input type="number" id="run-days" value="7" min="1" max="30">
          days
        </label>
        <label>
          Max new jobs
          <input type="number" id="run-max-jobs" placeholder="unlimited" min="1">
        </label>
      </div>

      <div class="run-criteria">
        <div class="run-criteria-group">
          <div class="run-criteria-header">
            <strong>Job Titles</strong>
            <button class="btn-select-all" onclick="toggleRunAll('title')">Toggle all</button>
          </div>
          <div id="run-titles" class="run-checks"></div>
        </div>
        <div class="run-criteria-group">
          <div class="run-criteria-header">
            <strong>Locations</strong>
            <button class="btn-select-all" onclick="toggleRunAll('location')">Toggle all</button>
          </div>
          <div id="run-locations" class="run-checks"></div>
        </div>
      </div>

      <div class="run-log" id="run-log"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-start" id="btn-start" onclick="startAgent()">▶ Start</button>
      <button class="btn-cancel" onclick="closeRunModal()">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
